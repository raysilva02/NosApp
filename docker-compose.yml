services:
  db:
    image: postgres:16
    container_name: nos-postgres
    environment:
      POSTGRES_USER: nos
      POSTGRES_PASSWORD: nos
      POSTGRES_DB: nos
    ports:
      - "5432:5432"
    volumes:
      - nos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nos -d nos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nos_pgdata:
